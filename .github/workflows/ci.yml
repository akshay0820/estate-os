# Quality gate for every push and pull request. No secrets are needed: the DB suite runs every migration against an
# in-process Postgres (PGlite), and no step deploys anything or talks to the hosted Supabase project.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:functions
      - run: npm test
      - run: npm run build
      - run: npm run predeploy
      - run: npm audit --omit=dev --audit-level=high
